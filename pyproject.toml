[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-playlist-bridge"
version = "0.4.0"
description = "Auditable NetEase Cloud Music to Spotify playlist migration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cloud Playlist Bridge contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
cloud-playlist-bridge = "cloud_playlist_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloud_playlist_bridge = ["web/*.html", "web/*.css", "web/*.js"]
